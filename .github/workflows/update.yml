# Automatic updates: runs every 3 hours (and on demand: Actions -> "Update Kaneo" -> Run workflow).
#
# 1. Looks up Kaneo's latest GitHub release and the digest of ghcr.io/usekaneo/kaneo:<version>.
# 2. If it is newer than the pinned one (or if "release package changes" is ticked), pins it,
#    bumps the package version, writes the CHANGELOG entry and builds the image with its
#    build-time checks. The build stops if upstream changed its startup files (upstream.sha256):
#    review them against start.sh / nginx.conf first.
# 3. Runs test/smoke.sh (the image the way Cloudron runs it, with PostgreSQL, including MCP) and
#    test/upgrade.sh (the last published version with real data, updated to the candidate).
# 4. Only if all of that passes: pushes the image to GHCR, adds the version to
#    CloudronVersions.json as published, commits and tags. Installations then see the update in
#    Cloudron (app -> Updates; installed automatically only where automatic updates are on).
# A failed run opens (or comments on) a GitHub issue, so a blocked update is visible.
name: Update Kaneo

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      release_package_changes:
        description: "Release even if Kaneo is unchanged (changes to this package on main)"
        type: boolean
        default: false
      notes:
        description: "CHANGELOG line for package changes (optional)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve Kaneo's latest release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/usekaneo/kaneo/releases/latest --jq .tag_name)
          version=${tag#v}
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected release tag ${tag}" >&2; exit 1; }
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:usekaneo/kaneo:pull" | jq -r .token)
          digest=$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/usekaneo/kaneo/manifests/${version}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          [[ "${digest}" == sha256:* ]] || { echo "could not resolve the digest of ghcr.io/usekaneo/kaneo:${version}" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: plan
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          DIGEST: ${{ steps.upstream.outputs.digest }}
          FORCE: ${{ inputs.release_package_changes }}
        run: |
          current=$(jq -r .upstreamVersion CloudronManifest.json)
          if [[ "$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -1)" != "${VERSION}" ]]; then
            echo "latest release ${VERSION} is older than the pinned ${current}" >&2; exit 1
          fi
          sed -i -E "s#ghcr.io/usekaneo/kaneo:[0-9.]+@sha256:[0-9a-f]+#ghcr.io/usekaneo/kaneo:${VERSION}@${DIGEST}#" Dockerfile
          # Also an update when the pin was already bumped on main (after an upstream.sha256 review) but not released yet.
          if [[ "${current}" == "${VERSION}" ]] && git diff --quiet Dockerfile; then upstream=false; else upstream=true; fi
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          # The manifest version not yet in CloudronVersions.json (first release): publish it as is.
          if jq -e --arg v "$(jq -r .version CloudronManifest.json)" '.versions | has($v)' CloudronVersions.json >/dev/null; then
            bump=true
          else
            bump=false
          fi
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          if [[ "${upstream}" == false && "${FORCE}" != true && "${bump}" == true ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "### Kaneo is up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "Kaneo ${VERSION} is already packaged; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and write the CHANGELOG entry
        id: version
        if: steps.plan.outputs.release == 'true'
        env:
          KANEO: ${{ steps.upstream.outputs.version }}
          UPSTREAM_CHANGED: ${{ steps.plan.outputs.upstream }}
          BUMP: ${{ steps.plan.outputs.bump }}
          NOTES: ${{ inputs.notes }}
        run: |
          old=$(jq -r .version CloudronManifest.json)
          if [[ "${BUMP}" == true ]]; then
            new=$(echo "$old" | awk -F. '{print $1"."$2"."$3+1}')
            jq --arg v "$new" --arg u "$KANEO" '.version = $v | .upstreamVersion = $u' CloudronManifest.json > m.json
            mv m.json CloudronManifest.json
            {
              echo
              echo "[${new}]"
              if [[ "${UPSTREAM_CHANGED}" == true ]]; then
                echo "* Update Kaneo to ${KANEO} (https://github.com/usekaneo/kaneo/releases/tag/v${KANEO})"
              fi
              if [[ -n "${NOTES}" ]]; then printf '* %s\n' "${NOTES}"; fi
              if [[ "${UPSTREAM_CHANGED}" != true && -z "${NOTES}" ]]; then echo "* Package maintenance release"; fi
            } >> CHANGELOG
          else
            # First release: keep the version, but ship the latest Kaneo.
            new=${old}
            jq --arg u "$KANEO" '.upstreamVersion = $u' CloudronManifest.json > m.json
            mv m.json CloudronManifest.json
            sed -i -E "s/^\* Initial release: Kaneo [0-9.]+$/* Initial release: Kaneo ${KANEO}/" CHANGELOG
          fi
          echo "version=${new}" >> "$GITHUB_OUTPUT"
          echo "kaneo=$(jq -r .upstreamVersion CloudronManifest.json)" >> "$GITHUB_OUTPUT"

      - name: Lint
        if: steps.plan.outputs.release == 'true'
        run: |
          bash -n start.sh app-env.sh test/smoke.sh test/upgrade.sh
          shellcheck -S warning start.sh app-env.sh test/smoke.sh test/upgrade.sh
          node --check loopback.mjs
          jq empty CloudronManifest.json CloudronVersions.json

      - name: Set up Docker Buildx
        if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image (runs the build-time checks)
        if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cloudron-kaneo:candidate

      - name: Smoke test
        if: steps.plan.outputs.release == 'true'
        run: test/smoke.sh cloudron-kaneo:candidate

      - name: Upgrade test (last published version with data -> candidate)
        if: steps.plan.outputs.release == 'true'
        run: |
          old=$(jq -r '[.versions | to_entries[] | select(.value.publishState == "published")]
            | sort_by(.key | split(".") | map(tonumber)) | last | .value.manifest.dockerImage // empty' CloudronVersions.json)
          if [[ -z "${old}" ]]; then echo "no published version yet; skipping"; exit 0; fi
          test/upgrade.sh "${old}" cloudron-kaneo:candidate

      - name: Log in to GHCR
        if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker tag cloudron-kaneo:candidate "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")
          [[ "${ref}" == "${IMAGE}@sha256:"* ]] || { echo "unexpected pushed reference ${ref}" >&2; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Publish the version, commit and tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KANEO: ${{ steps.version.outputs.kaneo }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          npm install --global cloudron@9.0.3
          cloudron versions add --image "${REF}" --state published
          cloudron versions verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile CloudronManifest.json CHANGELOG CloudronVersions.json
          git commit -m "Release ${VERSION} (Kaneo ${KANEO})"
          # main may have moved while this ran (package changes); the release files are ours.
          git pull --rebase origin main
          git tag -a "v${VERSION}" -m "Kaneo for Cloudron ${VERSION}"
          git push origin main "v${VERSION}"
          {
            echo "### Released ${VERSION} (Kaneo ${KANEO})"
            echo "Image: \`${REF}\`"
            echo
            echo "Update the app from the Cloudron dashboard: app → Updates."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed update
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          KANEO: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automatic update to Kaneo ${KANEO:-?} failed"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --title "${title}" --body "The automatic update stopped before publishing, so nothing was released and installations are unaffected.

          Run: ${RUN_URL}

          Typical causes: a build-time check (e.g. upstream changed its startup files, see upstream.sha256 in the README), the smoke test or the upgrade test. Fix on main; the next scheduled run retries."
          fi
