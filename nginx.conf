# Public entry point on port 8000, behind Cloudron's reverse proxy. Mirrors upstream's
# apps/web/nginx.kaneo.conf (SPA + /api and the MCP discovery routes proxied to the API), adapted to
# a read-only root filesystem and to running as the `cloudron` user.
worker_processes 2;
pid /run/kaneo/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /run/kaneo/nginx/client_body;
    proxy_temp_path /run/kaneo/nginx/proxy;
    fastcgi_temp_path /run/kaneo/nginx/fastcgi;
    uwsgi_temp_path /run/kaneo/nginx/uwsgi;
    scgi_temp_path /run/kaneo/nginx/scgi;

    # The client address as seen by Cloudron's reverse proxy (which sets X-Real-IP). Only trusted
    # from the Cloudron app network; the API in turn only trusts this nginx (loopback).
    # set_real_ip_from (Cloudron's proxy address) is written by start.sh.
    include /run/kaneo/nginx-http.conf;
    real_ip_header X-Real-IP;

    # Kaneo does not rate-limit sign-in on self-hosted instances, and anyone can register MCP
    # clients (capped at 1000, kept 30 days). Limit both per client address.
    limit_req_zone $binary_remote_addr zone=kaneo_auth:1m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=kaneo_mcp_register:1m rate=5r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Browser caching of the web app. index.html (and every client-side route, which serves it) is
    # revalidated on each load, so after an update browsers pick up the new, differently named
    # chunks instead of requesting removed ones ("Failed to fetch dynamically imported module").
    # Hashed assets can be cached. API responses keep the API's own headers.
    map $uri $kaneo_cache_control {
        ~^/api/          "";
        ~^/\.well-known/ "";
        ~^/assets/       "public, max-age=604800";
        default          "no-cache";
    }

    # TLS ends at Cloudron's proxy; pass its scheme on.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8000 default_server;
        listen [::]:8000 default_server;
        server_name _;

        # Allow larger OAuth/Better Auth session cookies in request headers.
        client_header_buffer_size 8k;
        large_client_header_buffers 4 32k;
        client_max_body_size 25m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $kaneo_cache_control;

        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level 6;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Kaneo-Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append: the API walks this header through trusted hops only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # MCP OAuth discovery (RFC 9728 / RFC 8414) at the origin root.
        location = /.well-known/oauth-protected-resource/api/mcp {
            proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        }

        location = /.well-known/oauth-authorization-server/api {
            proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        }

        location /.well-known/ {
            return 404;
        }

        # Written by start.sh: closes local password sign-up when the app uses Cloudron sign-in.
        include /run/kaneo/nginx-server.conf;

        # Password, code and link sign-in, sign-up and password reset.
        location ~ ^/api/auth/(sign-in/email|sign-up/email|sign-in/email-otp|email-otp/|sign-in/magic-link|magic-link/|request-password-reset|reset-password) {
            limit_req zone=kaneo_auth burst=20 nodelay;
            proxy_pass http://127.0.0.1:1337;
        }

        location = /api/mcp/register {
            limit_req zone=kaneo_mcp_register burst=10 nodelay;
            proxy_pass http://127.0.0.1:1337;
        }

        # Streamable HTTP MCP endpoint: no buffering, long-running tool calls.
        location = /api/mcp {
            proxy_pass http://127.0.0.1:1337/api/mcp;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:1337/api/;
            proxy_read_timeout 300s;
        }

        location ~* \.map$ {
            return 404;
        }

        # The built web app, with the public URLs filled in by start.sh at every start.
        location / {
            root /run/kaneo/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
