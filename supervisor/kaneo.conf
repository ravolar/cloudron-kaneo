# Cloudron stops containers with a 10 s grace period and supervisor stops the programs one after
# another (nginx, then the API), so their stopwaitsecs add up to less than that.
#
# loopback.mjs binds the API to 127.0.0.1:1337; nginx owns the public port 8000.
[program:api]
priority=10
directory=/app/code/kaneo/apps/api
command=/app/pkg/app-env.sh node --enable-source-maps --import /app/pkg/loopback.mjs dist/index.js
environment=NODE_ENV="production"
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=20
directory=/run/kaneo
command=nginx -e stderr -c /app/pkg/nginx.conf -g "daemon off;"
user=cloudron
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
